Screens:
  WorkRequest_Screen:
    Properties:
      Fill: =
      LoadingSpinnerColor: =RGBA(98, 100, 167, 1)
      OnVisible: "=\r\n\r\n// =============================\r\n// [1] 현재 로그인 사용자 정보\r\n// =============================\r\nSet(varMyEmail, Lower(User().Email));\r\n\r\nSet(\r\n    varMyInfo,\r\n    LookUp(\r\n        UserInfo_DB,\r\n        Lower('e-mail') = varMyEmail\r\n    )\r\n);\r\n\r\nSet(\r\n    varMyName,\r\n    Coalesce(\r\n        varMyInfo.이름_한글,\r\n        Trim(\r\n            If(\r\n                IsBlank(Find(\"(\", User().FullName)),\r\n                Concatenate(\r\n                    Trim(Right(User().FullName, Len(User().FullName) - Find(\" \", User().FullName))),\r\n                    Trim(Left(User().FullName, Find(\" \", User().FullName)))\r\n                ),\r\n                Trim(Left(User().FullName, Find(\"(\", User().FullName) - 1))\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\nSet(varMyDept, Coalesce(varMyInfo.부문, \"\"));\r\nSet(varMyTeam, Coalesce(varMyInfo.팀, \"\"));\r\nSet(varMyJobGrade, Coalesce(varMyInfo.직급2, \"\"));\r\n\r\n// =============================\r\n// [2] 역할 판단\r\n// =============================\r\nSet(\r\n    varIsTeamLeader,\r\n    varMyJobGrade in [\"팀장\", \"소장\", \"이사\"]\r\n);\r\n\r\nSet(\r\n    varIsVAApprover,\r\n    varMyEmail in [\r\n        Lower(\"yoonju.park@tym.world\"),\r\n        Lower(\"donghyeon.gim@tym.world\")\r\n    ]\r\n);\r\n\r\n// 관리자 판단 (개발자 전용 — 전체 목록 조회)\r\nSet(\r\n    varIsAdmin,\r\n    varMyEmail in [Lower(\"eunseong.kim@tym.world\")] ||\r\n    varMyEmail in [Lower(\"rdplan@tym.world\")]\r\n);\r\n\r\n// 가상검증팀 소속 여부 (제목 인라인 수정 권한)\r\nSet(\r\n    varIsVATeamMember,\r\n    varMyTeam = \"가상검증팀\"\r\n);\r\n\r\n\r\n// =============================\r\n// [3] 가상검증 승인자 고정값\r\n// 이름은 저장하지 않고 이메일만 사용\r\n// =============================\r\nSet(varVAApprover1Email, Lower(\"yoonju.park@tym.world\"));\r\nSet(varVAApprover2Email, Lower(\"donghyeon.gim@tym.world\") );\r\n\r\n// 담당자 변경 권한자 (박윤주 팀장 전용)\r\nSet(\r\n    varIsAssigneeManager,\r\n   varMyEmail = Lower(\"yoonju.park@tym.world\")\r\n   \r\n);\r\n\r\n// =============================\r\n// [4] 화면 상태 변수 초기화\r\n// =============================\r\nSet(varShowRequestPopup, false);\r\nSet(varRequestMode, \"View\");\r\nSet(varSelectedRequest, Defaults(Analysis_Request_DB));\r\n\r\n// =============================\r\n// [5] 필터 기본값\r\n// =============================\r\nSet(varPeriodFilter, Text(Year(Today())) & \"년\
